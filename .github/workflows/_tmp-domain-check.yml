name: _Temp Domain Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check custom domain reachability
        run: |
          echo "=== GET / ==="
          curl -sS -i -m 15 "https://team-claude-billing.ntdcoworks.com/" || echo "CURL FAILED (exit $?)"
          echo
          echo "=== POST / (simulated Discord PING, no signature) ==="
          curl -sS -i -m 15 -X POST "https://team-claude-billing.ntdcoworks.com/" \
            -H "Content-Type: application/json" \
            -d '{"type":1}' || echo "CURL FAILED (exit $?)"

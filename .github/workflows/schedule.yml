name: Schedule (Auto)

# 매일 09:00 KST(00:00 UTC) 실행.
# 날짜에 따라 적절한 알림을 자동으로 선택해 발송합니다:
#   - 매월 1일        → 월간 환율 리포트 + 환율 그래프 (2주 1회 첫 번째)
#   - 결제일 D-7/D-3  → 결제 알림 (인당 입금액 + 버튼)
#   - 결제 당일(D-0)  → 환율 그래프 발송 (2주 1회 두 번째, KV 캐시 포함)
#   - 그 외           → 아무 동작 없음

on:
  schedule:
    - cron: '0 0 * * *'

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # surplus.json 자동 커밋용
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        working-directory: notifier
        run: uv sync

      - name: Run notifier (auto)
        working-directory: notifier
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          KOREAEXIM_API_KEY: ${{ secrets.KOREAEXIM_API_KEY }}
          VAT_RATE: ${{ vars.VAT_RATE || '0.10' }}
          SAFETY_MARGIN: ${{ vars.SAFETY_MARGIN || '0.05' }}
          BILLING_DAY: ${{ vars.BILLING_DAY || '15' }}
        run: uv run python -m src.main --mode auto

      - name: Commit surplus history (if changed)
        run: |
          if [[ -n "$(git status --porcelain data/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore(notifier): update surplus history [skip ci]"
            git push
          fi
